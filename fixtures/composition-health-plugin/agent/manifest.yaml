version: 2
app_id: health
package_version: 0.1.0
skills:
  - id: composition-health
    path: skills/composition-health/SKILL.md
    summary: 测试 Health 组合读取
    capabilities: [health.summary.read]
capabilities:
  - id: health.summary.read
    summary: 读取测试健康摘要
    audience: health
    scopes: [health.summary.read]
    tools:
      - name: health.summary.read
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_health_summary
        exposure: on-demand
        result_mode: summary
        max_result_bytes: 4096
        max_model_chars: 1000
        timeout_ms: 5000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: sensitive
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
