version: 2
app_id: conformance
package_version: 0.1.0
skills:
  - id: shadow-conformance
    path: skills/shadow-conformance/SKILL.md
    summary: 验证 Shadow 在 DSH 中的读取、草案、受控写入和明确确认行为
    capabilities:
      - conformance.records.read
      - conformance.drafts.create
      - conformance.records.apply
      - conformance.records.publish
    invocation:
      model: true
      user: true
capabilities:
  - id: conformance.records.read
    summary: 读取一条测试记录的最小摘要
    audience: conformance
    scopes: [conformance.records.read]
    tools:
      - name: conformance.records.get
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_record
        exposure: always
        result_mode: summary
        max_result_bytes: 4096
        max_model_chars: 1000
        timeout_ms: 5000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: internal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: false
    idempotency_required: false
  - id: conformance.drafts.create
    summary: 创建一条可撤销的私有测试草案
    audience: conformance
    scopes: [conformance.drafts.create]
    tools:
      - name: conformance.drafts.create
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_draft
        exposure: on-demand
        result_mode: reference
        max_result_bytes: 4096
        max_model_chars: 1000
        timeout_ms: 5000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: internal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: false
    idempotency_required: true
  - id: conformance.records.apply
    summary: 将测试草案应用为私有记录
    audience: conformance
    scopes: [conformance.records.apply]
    tools:
      - name: conformance.records.apply
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: apply_record
        exposure: on-demand
        result_mode: reference
        max_result_bytes: 4096
        max_model_chars: 1000
        timeout_ms: 5000
        concurrency_safe: false
        retry_policy: idempotent
    effect: write
    data_classification: personal
    risk_level: L2
    confirmation: policy
    reversible: true
    resource_grant_required: true
    idempotency_required: true
  - id: conformance.records.publish
    summary: 将一条测试记录发布到外部可见位置
    audience: conformance
    scopes: [conformance.records.publish]
    tools:
      - name: conformance.records.publish
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: publish_record
        exposure: on-demand
        result_mode: reference
        max_result_bytes: 4096
        max_model_chars: 1000
        timeout_ms: 5000
        concurrency_safe: false
        retry_policy: idempotent
    effect: publish
    data_classification: personal
    risk_level: L3
    confirmation: explicit
    reversible: false
    resource_grant_required: true
    idempotency_required: true
