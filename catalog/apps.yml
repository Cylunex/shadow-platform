version: 1
# forward-auth 项是历史/占位状态，不代表接入方案；对应项目改造前应切为 oidc 并登记 client。
apps:
  garden:
    title: Shadow Garden
    owner: example-owner
    lifecycle: production
    kind: web
    canonical_url: https://example.com/
    auth:
      mode: public-with-protected-paths
      groups: [garden-admins]
    health_path: null
    media: true
    llm_models: []
    agent_audience: true

  health:
    title: Shadow Health
    owner: example-owner
    lifecycle: production
    kind: web
    canonical_url: https://health.example.com/
    aliases:
      - https://nas.example.com:18080/shealth/
    auth:
      mode: forward-auth
      groups: [health-users]
    health_path: /healthz
    media: true
    llm_models: [vision-default]
    agent_audience: true

  stock:
    title: Shadow Stock
    owner: example-owner
    lifecycle: production
    kind: web
    canonical_url: https://stock.example.com/
    auth:
      mode: oidc
      groups: [stock-users]
    health_path: /healthz
    media: false
    llm_models: [chat-default, reasoning-default]
    agent_audience: true

  foliant:
    title: Shadow Foliant
    owner: example-owner
    lifecycle: experimental
    kind: service
    canonical_url: null
    auth:
      mode: service-bearer
      groups: []
    health_path: null
    media: false
    llm_models: [chat-default, reasoning-default]
    agent_audience: true

  travel:
    title: Shadow Travel
    owner: example-owner
    lifecycle: experimental
    kind: web
    canonical_url: https://example.com/travel/
    aliases:
      - https://travel.example.com/
    auth:
      mode: oidc
      groups: [travel-users]
    health_path: /travel/healthz
    media: true
    llm_models: [chat-default, reasoning-default, vision-default]
    agent_audience: true
