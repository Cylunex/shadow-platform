[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shadow-platform"
version = "0.8.0"
description = "Shared identity, asset, notification, LLM and agent foundations for Shadow applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.25,<5",
  "pillow>=11,<13",
  "pyjwt>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
heic = ["pillow-heif>=1,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.39,<2"]

[project.scripts]
shadow-notify-web = "notification_service.app:main"
shadow-notify-worker = "notification_service.worker:main"
shadow-plugin-validate = "scripts.validate_shadow_plugin:main"
shadow-dsh-build = "scripts.build_dsh_bundle:main"
shadow-profile-build = "scripts.build_shadow_profile:main"
shadow-profile-activate = "scripts.activate_shadow_profile:main"
shadow-platform-doctor = "scripts.platform_doctor:main"
shadow-deployment-doctor = "scripts.deployment_doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["media_service", "notification_service", "scripts", "shadow_sdk", "telemetry_service"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "shadow_sdk/contracts"
"compositions" = "shadow_sdk/compositions"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
