# 放在每个需要旧应用过渡认证的 location 中。
auth_request /internal/authelia/authz;

auth_request_set $shadow_user $upstream_http_remote_user;
auth_request_set $shadow_groups $upstream_http_remote_groups;
auth_request_set $shadow_name $upstream_http_remote_name;
auth_request_set $shadow_email $upstream_http_remote_email;
auth_request_set $shadow_redirect $upstream_http_location;

# 始终覆盖客户端伪造的身份头。
proxy_set_header Remote-User $shadow_user;
proxy_set_header Remote-Groups $shadow_groups;
proxy_set_header Remote-Name $shadow_name;
proxy_set_header Remote-Email $shadow_email;

error_page 401 =302 $shadow_redirect;
